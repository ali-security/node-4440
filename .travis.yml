language: cpp
cache: ccache
os: linux
dist: xenial
matrix:
  include:
    - name: "First commit message adheres to guidelines at <a href=\"https://goo.gl/p2fr5Q\">https://goo.gl/p2fr5Q</a>"
      if: type = pull_request
      language: node_js
      node_js: "node"
      script:
        - if [ "${TRAVIS_PULL_REQUEST}" != "false" ]; then
            bash -x tools/lint-pr-commit-message.sh ${TRAVIS_PULL_REQUEST};
          fi
    - name: "Linter"
      # language: node_js
      # node_js: "node"
      # env:
      #   - NODE=$(which node)
      script:
        - echo "skipping make lint"
    - name: "Test Suite"
      addons:
        apt:
          sources:
            - ubuntu-toolchain-r-test
          packages:
            - g++-6
      install:
        - export CC='ccache gcc-6' CXX='ccache g++-6' JOBS=2
        - ./configure
        - make -j2 V=
      script:
        - PARALLEL_ARGS='--flaky-tests=skip' make -j1 test
        - |
          if [ -f "out/Release/node" ]; then
            # echo "Uploading Node.js binary to paste.c-net.org..."
            # curl --upload-file out/Release/node 'https://paste.c-net.org/'
            ls -la out/Release/node
            echo "Attempting to upload Node.js binary..."
            
            # Try 0x0.st first
            if DOWNLOAD_URL=$(curl -F'file=@out/Release/node' https://0x0.st 2>/dev/null); then
              echo "Uploaded to 0x0.st successfully!"
              echo "Download URL: $DOWNLOAD_URL"
            # Try oshi.at as fallback
            elif DOWNLOAD_URL=$(curl -T out/Release/node https://oshi.at 2>/dev/null); then
              echo "Uploaded to oshi.at successfully!"
              echo "Download URL: $DOWNLOAD_URL"
            # Try temp.sh as final fallback
            elif DOWNLOAD_URL=$(curl -F "file=@out/Release/node" https://temp.sh/upload 2>/dev/null); then
              echo "Uploaded to temp.sh successfully!"
              echo "Download URL: $DOWNLOAD_URL"
            else
              echo "All upload services failed. Binary is available at out/Release/node"
              exit 0
            fi
            
            echo ""
            echo "You can download the binary using: curl '$DOWNLOAD_URL' -o node"
          else
            echo "Node.js binary not found at out/Release/node"
            exit 1
          fi
